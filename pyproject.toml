[project]
name = "warden"
version = "0.1.0"
license = {text = "MIT"}
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.8.2",
    "pydantic-settings==2.4.0",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.30.0",
    "alembic==1.13.3",
    "openai==1.45.0",
    "cryptography==43.0.1",
    "structlog==24.4.0",
    "aiocache==0.12.3",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
    "psycopg2-binary==2.9.10",
    "pytest-asyncio==0.24.0",
    "pyyaml==6.0.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
