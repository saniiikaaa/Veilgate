name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: guardrail_v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d guardrail_v2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://guardrail_app:apppass@localhost:5432/guardrail_v2
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/guardrail_v2
      LLM_JUDGE: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest
      - run: docker build -f deploy/docker/Dockerfile.api -t veilgate-ci .
